packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Scripts de compilación nativa permitidos. Cualquier otro se bloquea por seguridad.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Scripts de paquetes transitivos que no necesitamos para compilar. Se declaran bloqueados de forma explícita.
  browser-tabs-lock: false
  core-js: false
